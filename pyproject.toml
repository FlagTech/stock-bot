[project]
name = "stock-bot"
version = "0.1.0"
description = "第六章：本機 LINE / Telegram AI 股票分析機器人"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "openai>=1.60,<4", "pandas>=2.2,<4", "yfinance>=0.2.54,<2",
  "pydantic>=2.9,<3", "keyring>=25,<26", "pyngrok>=7,<8",
  "filelock>=3.16,<4", "tzdata>=2024.1",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
stock-bot = "stock_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_bot"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]
